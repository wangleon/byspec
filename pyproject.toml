[build-system]
requires = ["setuptools >= 75.3.2"]
build-backend = "setuptools.build_meta"

[project]
name = "byspec"
version = "0.6"
authors = [
  { name="Liang Wang", email="wang.leon@gmail.com" },
  { name="Deyang Song" },
  { name="Zichong Zhang" },
]
description = "BFOSC and YFOSC Spectra Data Reduction Pipeline"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dateutil >= 2.8.2",
    "numpy >= 1.24",
    "scipy >= 1.8.0",
    "matplotlib >= 3.4.1",
    "astropy >= 5.1",
]
license = { text = "Apache-2.0" }

[project.urls]
Homepage = "https://github.com/wangleon/byspec"
Issues = "https://github.com/wangleon/byspec/issues"
